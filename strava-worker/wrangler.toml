name = "ironman-strava"
main = "worker.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "KV"
id = "149198b10a2147c3a52546b901f957b8"

[vars]
# Origines autorisées à appeler l API, séparées par des virgules : le site hébergé, tes tests locaux (http://localhost:8080) et « null » (page ouverte en file:///).
# Ne mets pas file:/// ici (ça ne marche pas depuis un iPhone) ; « * » est possible pour un premier test.
ALLOWED_ORIGIN = "https://ironmanproject.vercel.app,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,null"
# Première date récupérée
SINCE = "2026-01-01"
# Identifiant client Google (public) pour « Se connecter avec Google » : à coller ici après sa création dans Google Cloud Console.
# Tant qu'il est vide, la connexion Google est masquée dans l'app.
GOOGLE_CLIENT_ID = "502757245043-gdt980nau1f2gbs9bu0qqfu69mdcau1u.apps.googleusercontent.com"

# Suivi propriétaire (onglet Plus → Suivi de l'app) : secret ADMIN_EMAILS, e-mails Google autorisés séparés par des virgules.
#   npx wrangler secret put ADMIN_EMAILS
# Statistiques d'usage anonymes (compteurs agrégés par jour : aucun identifiant, aucune adresse IP stockée)
[[d1_databases]]
binding = "DB"
database_name = "triathlon-stats"
database_id = "c9824bed-b4cf-4ecc-8f9b-97733998e435"
