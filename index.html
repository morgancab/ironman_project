<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan tri">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Plan d’entraînement triathlon sur mesure : choisis ta course, suis tes séances, synchronise Garmin.">
<title>Plan triathlon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<style>
:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--sep:rgba(84,84,88,.5);
  --t1:#f5f4ef;--t2:#a9a8a0;--t3:#85847d;--acc:#f5f4ef;--grid:#2c2c2e;--axis:#48484a;
  --swim:#3987e5;--bike:#199e70;--run:#d95926;--str:#98989f;
  --good:#0ca30c;--warn:#fab219;--ser:#ec835a;--crit:#d03b3b;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t1);min-height:100vh;min-height:100dvh;
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button:disabled{opacity:.3;cursor:default}
.ic{display:block;flex:none}
#statusbg{position:fixed;top:0;left:0;right:0;height:var(--sat);background:rgba(0,0,0,.72);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);z-index:30}
#view{max-width:640px;margin:0 auto;padding:calc(var(--sat) + 14px) 16px calc(92px + var(--sab))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:var(--sab);
  background:rgba(22,22,24,.82);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--sep)}
.tabbar-in{display:flex;max-width:640px;margin:0 auto}
.tab{flex:1;min-height:52px;border:0;background:none;color:var(--t3);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:6px 0 4px;font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tab[aria-selected=true]{color:var(--t1)}

/* ---------- Typographie & composants ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t2)}
h1{margin:3px 0 0;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.02em}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--t1);display:grid;place-items:center;flex:none}
.card{background:var(--card);border-radius:20px;padding:16px;margin:0 0 14px}
.card h2{margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.card h2 small{font-weight:500;color:var(--t2);font-size:13px;margin-left:6px}
.muted{color:var(--t2)}.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--t2);white-space:nowrap}
.chip.hl{background:var(--t1);color:#000}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}

.hero{text-align:center;padding:22px 16px 18px;background:linear-gradient(160deg,#262932,#15161b)}
.hero .big{font-size:80px;line-height:1;font-weight:800;letter-spacing:-.035em;margin-top:6px}
.hero .unit{font-size:15px;font-weight:600;color:var(--t2);margin-top:2px}
.cd{display:flex;justify-content:center;gap:10px;margin-top:16px}
.cd div{min-width:68px;background:rgba(255,255,255,.07);border-radius:14px;padding:9px 6px}
.cd b{display:block;font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.cd span{font-size:10.5px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.hero .date{margin-top:16px;font-size:14px;color:var(--t2)}
.hero .state{margin-top:6px;font-size:14px;font-weight:600}

.pr{margin:0 0 15px}.pr:last-child{margin:0}
.pr-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px;font-size:14px}
.pr-h b{font-weight:600}.pr-h span{color:var(--t2);font-variant-numeric:tabular-nums;font-size:13.5px}
.bar{height:8px;border-radius:4px;background:#2f2f32;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--acc));width:var(--p,0%);transition:width .35s}
.tot{display:flex;align-items:baseline;gap:8px;margin:2px 0 16px}
.tot b{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tot span{color:var(--t2);font-size:14px}
.sp-swim{--c:var(--swim);--cb:rgba(57,135,229,.18)}
.sp-bike{--c:var(--bike);--cb:rgba(25,158,112,.18)}
.sp-run,.sp-brick{--c:var(--run);--cb:rgba(217,89,38,.18)}
.sp-str{--c:var(--str);--cb:rgba(152,152,159,.18)}
.sp-rest{--c:var(--str);--cb:rgba(152,152,159,.12)}
.sp-race{--c:#f5f4ef;--cb:rgba(245,244,239,.14)}
.spr{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.spr:last-child{margin:0}
.spr .ico{flex:none;width:38px;height:38px;border-radius:11px;background:var(--cb);color:var(--c);display:grid;place-items:center}
.spr .bd{flex:1;min-width:0}

.legend{display:flex;gap:14px;margin:10px 0 2px;font-size:12.5px;color:var(--t2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.readout{margin-top:8px;font-size:13.5px;color:var(--t2);min-height:20px}
.readout b{color:var(--t1);font-weight:600}
svg text{font-family:inherit}
.chartwrap svg{width:100%;height:auto;display:block;touch-action:manipulation}
svg[data-ch]{touch-action:pan-y;cursor:crosshair}

.next{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card2);border-radius:16px;padding:12px;text-align:left}
.next .ico{flex:none;width:42px;height:42px;border-radius:12px;background:var(--cb);color:var(--c);display:grid;place-items:center}

/* ---------- Navigation semaine ---------- */
.nav{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.nav-c{flex:1;text-align:center;min-width:0}
.nav-c b{display:block;font-size:17px;font-weight:700}
.nav-c small{display:block;color:var(--t2);font-size:13px;margin-top:1px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:14px;color:var(--t2)}
.banner b{color:var(--t1)}
.theme{background:linear-gradient(160deg,#262932,#1a1b21)}
.theme .t{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:6px 0 8px}
.theme p{margin:0;font-size:14.5px;color:#d3d2ca}
.day{margin:22px 0 9px;display:flex;align-items:baseline;gap:8px}
.day h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.day small{color:var(--t2);font-size:13.5px}
.day .sp{flex:1}
.sess{background:var(--card);border-radius:18px;margin:0 0 10px;overflow:hidden}
.s-row{display:flex;align-items:stretch}
.s-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:13px 2px 13px 13px;background:none;border:0;text-align:left}
.s-ic{flex:none;width:44px;height:44px;border-radius:13px;background:var(--cb);color:var(--c);display:grid;place-items:center}
.s-txt{flex:1;min-width:0}
.s-t{display:block;font-weight:650;font-size:16px;line-height:1.25}
.s-m{display:block;font-size:13px;color:var(--t2);margin-top:2px}
.s-chev{flex:none;color:var(--t3);transition:transform .2s;margin-right:2px}
.sess.open .s-chev{transform:rotate(180deg)}
.chk{flex:none;width:58px;border:0;background:none;display:grid;place-items:center}
.chk i{width:30px;height:30px;border-radius:50%;border:2px solid #636366;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.chk[aria-checked=true] i{background:var(--c);border-color:var(--c);color:#fff}
.sess.done .s-t{color:var(--t2)}
.s-det{display:none;padding:2px 16px 15px;border-top:.5px solid var(--sep)}
.sess.open .s-det{display:block}
.s-det ul{margin:12px 0 0;padding:0;list-style:none}
.s-det li{position:relative;padding-left:16px;margin:0 0 8px;font-size:14.5px;color:#d6d5cd}
.s-det li:before{content:'';position:absolute;left:1px;top:.5em;width:6px;height:6px;border-radius:50%;background:var(--c)}
.goal{margin-top:12px;font-size:14px;color:var(--t1);background:rgba(255,255,255,.06);border-radius:12px;padding:9px 12px}
.goal b{font-weight:650;color:var(--t2);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.inp{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;margin:0 0 8px;font-size:14.5px}
.inp small{display:block;color:var(--t2);font-size:12px}
.inp input{height:44px;border-radius:12px;border:0;background:var(--card2);color:var(--t1);font-size:16px;font-family:inherit;padding:0 12px;width:100%;text-align:right}
.act{margin-top:12px;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px}
.act>b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);font-weight:650;margin-bottom:3px}
.act .an{font-weight:600;font-size:15px}
.sv{color:var(--t1);font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);border-radius:6px;padding:1px 6px;margin-right:2px}
.srow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card2);border-radius:14px;padding:11px 12px;margin:0 0 8px;text-align:left;min-height:56px}
.sr-t{flex:1;min-width:0}
.sr-t b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-t small{display:block;color:var(--t2);font-size:12.5px;margin-top:1px}
.sr-b{flex:none;max-width:42%;text-align:right;font-size:12px;color:var(--t2)}
.sr-b.ok{color:var(--t1);font-weight:600}
.inp.wide{grid-template-columns:1fr}
.inp.wide input{text-align:left}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:0 0 16px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;color:var(--t2);font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:#3a3a3d;color:var(--t1)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.kpi{background:var(--card);border-radius:16px;padding:12px 11px;min-width:0}
.sheet .kpi{background:var(--card2)}
.kl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t2)}
.kv{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.ks{font-size:11.5px;color:var(--t2);margin-top:3px;line-height:1.25}
.inp.tp-f{grid-template-columns:1fr auto}
.tval{min-width:120px;height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--card2);color:var(--t1);font-size:16px;font-weight:600;font-family:inherit;font-variant-numeric:tabular-nums;white-space:nowrap}
.tval.empty{color:var(--t2);font-weight:500}
.sheet .tval{background:var(--card3)}
.tp-bg{position:fixed;left:0;right:0;top:0;bottom:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.tp-bg.on{opacity:1;pointer-events:auto}
.tp{width:100%;max-width:520px;background:var(--card2);border-radius:20px 20px 0 0;padding:6px 16px calc(20px + var(--sab));transform:translateY(24px);transition:transform .2s}
.tp-bg.on .tp{transform:none}
.tp-h{display:flex;align-items:center;gap:8px;min-height:52px}
.tp-h b{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:600}
.tp-h button{flex:none;min-width:76px;min-height:44px;border:0;background:none;color:var(--t2);font-family:inherit;font-size:15px;text-align:left;padding:0}
.tp-h button.ok{color:var(--t1);font-weight:700;text-align:right}
.tp-w{position:relative;display:flex;justify-content:center;gap:6px;height:200px}
.tp-w::before{content:'';position:absolute;left:0;right:0;top:80px;height:40px;border-radius:10px;background:rgba(255,255,255,.09);pointer-events:none}
.tw-col{position:relative;display:flex;align-items:center;flex:1;max-width:130px;min-width:0}
.tw-list{flex:1;min-width:0;height:200px;padding:80px 0;box-sizing:border-box;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;outline:0;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.tw-list::-webkit-scrollbar{display:none}
.tw-item{height:40px;line-height:40px;text-align:right;padding-right:6px;scroll-snap-align:center;font-size:22px;color:var(--t2);font-variant-numeric:tabular-nums;cursor:pointer}
.tw-item.on{color:var(--t1);font-weight:600}
.tw-unit{flex:none;width:34px;font-size:14px;color:var(--t2)}
.rng{display:flex;gap:6px;margin:0 0 6px}
.rng button{border:0;background:var(--card2);color:var(--t2);border-radius:999px;height:30px;padding:0 12px;font-size:12.5px;font-weight:600}
.rng button[aria-pressed=true]{background:var(--t1);color:#000}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
.mt div{font-size:12px;color:var(--t2)}
.mt b{display:block;font-size:16px;color:var(--t1);font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.zbar{display:flex;gap:2px;height:14px;margin:4px 0 10px}
.zbar span{display:block;min-width:2px;border-radius:3px}
.zrow{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.zrow i{width:10px;height:10px;border-radius:3px;flex:none}
.zrow span:last-child{margin-left:auto;color:var(--t2);font-variant-numeric:tabular-nums}
.ivr{display:grid;grid-template-columns:30px 1.1fr 1fr 1fr .8fr;gap:6px;font-size:13px;padding:7px 0;border-bottom:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.ivr.h{color:var(--t2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.ivr.rest{color:var(--t3);font-size:12px;padding:4px 0}
.spl{display:grid;grid-template-columns:44px 1fr 66px 34px;align-items:center;gap:8px;font-size:12.5px;margin:7px 0;font-variant-numeric:tabular-nums}
.spl .b{height:10px;border-radius:5px;background:var(--c)}
.dh{font-size:15px;font-weight:700;margin:0 0 8px}
.dh small{font-weight:500;color:var(--t2);font-size:12px;margin-left:6px}
#tip{position:fixed;z-index:70;pointer-events:none;background:#2c2c2e;border:.5px solid rgba(120,120,128,.6);border-radius:12px;padding:8px 11px;font-size:12.5px;line-height:1.4;box-shadow:0 8px 28px rgba(0,0,0,.55);max-width:250px;opacity:0;transition:opacity .08s;left:0;top:0}
#tip.on{opacity:1}
#tip b{font-weight:650}
#tip .tm{color:var(--t2)}
.dates{display:flex;gap:10px;margin:8px 0 0}
.dates label{flex:1;font-size:12px;color:var(--t2)}
.dates input{display:block;width:100%;height:40px;margin-top:3px;border-radius:10px;border:0;background:var(--card2);color:var(--t1);font-size:15px;padding:0 10px;font-family:inherit;color-scheme:dark}
.rhero{text-align:center;padding:20px 16px 18px;background:linear-gradient(160deg,#262932,#15161b)}
.rhero .big{font-size:54px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.rline{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.rline:last-child{margin:0}
.rline .ico{flex:none;width:38px;height:38px;border-radius:11px;background:var(--cb);color:var(--c);display:grid;place-items:center}
.rline .bd{flex:1;min-width:0}
.rline .t{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rline small{display:block;color:var(--t2);font-size:12px;margin-top:2px;line-height:1.3}
.cf{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;background:rgba(255,255,255,.12);color:var(--t1)}
.warn{display:flex;gap:10px;background:rgba(250,178,25,.10);border:1px solid rgba(250,178,25,.4);border-radius:14px;padding:10px 12px;font-size:13px;color:#ecd9a8;margin:0 0 14px}
.warn svg{color:var(--warn);flex:none;margin-top:1px}
.sec-t{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--t2);font-weight:650;margin:16px 0 4px}
.sub-t{font-size:13px;font-weight:700;color:var(--t1);margin:12px 0 2px}
.st{display:flex;gap:12px;padding:10px 0;border-bottom:.5px solid var(--sep)}
.st:last-child{border-bottom:0}
.st .du{flex:none;width:62px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.3}
.st .bd{flex:1;min-width:0}
.st .nm{font-weight:650;font-size:14.5px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cp{font-size:12px;font-weight:650;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.08);color:var(--t1);white-space:nowrap;font-variant-numeric:tabular-nums}
.cp.pc{background:var(--cb);color:var(--c)}
.cp.rpe{background:none;border:1px solid rgba(255,255,255,.18);color:var(--t2);font-weight:600}
.rep{margin:6px 0;padding:2px 0 2px 12px;border-left:3px solid var(--c);border-radius:2px}
.rep .rh{font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--c);text-transform:uppercase;margin-top:4px}
.rep .st:last-child{border-bottom:0}
.tip{margin-top:10px;font-size:13.5px;color:var(--t2);background:rgba(255,255,255,.05);border-radius:12px;padding:9px 12px}
.legendrpe{font-size:13px;color:var(--t2);line-height:1.5}
.legendrpe b{color:var(--t1);font-weight:600}

/* ---------- Plan 26 semaines ---------- */
.phasebar{position:relative;display:flex;gap:2px;height:14px;margin:12px 0 6px}
.phticks{display:flex;gap:2px;margin:0 0 14px;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.phticks span{min-width:0;white-space:nowrap}
.phasebar span{display:block;border-radius:4px}
.phasebar .mk{position:absolute;top:-6px;width:4px;height:26px;margin-left:-2px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px #1c1c1e}
.plan-dates{margin:6px 0 0;font-size:15px;font-weight:600}
.plan-h{display:flex;align-items:baseline;margin:24px 4px 10px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t2)}
.plan-h span{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500;color:var(--t3)}
.now{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--t1);color:#000;font-size:11px;font-weight:700;letter-spacing:0;line-height:1.3;vertical-align:2px}
.adm-g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.adm-c{background:var(--card2);border-radius:14px;padding:12px 14px}
.adm-c b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.adm-c span{font-size:12.5px;color:var(--t2)}
.adm-u{padding:14px 0;border-bottom:.5px solid var(--sep)}
.adm-u:last-child{border-bottom:0}
.adm-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px;font-size:15px}
.adm-e{overflow-wrap:anywhere}
.adm-r{margin-top:8px;font-size:14px}
.adm-r b{font-weight:600}
.sgl{margin:20px 4px 8px}
.mhero{display:block;width:100%;border:0;text-align:left;color:var(--t1);background:var(--card);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--brd);padding:18px;font-family:inherit}
.mhero:active{background:var(--card2)}
.mh-top{display:flex;justify-content:space-between;align-items:center}
.mh-j{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--card3);border-radius:999px;padding:3px 10px}
.mh-n{display:block;margin-top:8px;font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.mh-s{display:block;margin:4px 0 14px;font-size:13.5px;color:var(--t2)}
.mh-f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums}
.mh-l{display:inline-flex;align-items:center;gap:2px;color:var(--t1);font-weight:600;text-align:right}
.scard{background:var(--card2);border-radius:18px;overflow:hidden}
.sheet .scard>.fold{background:none;margin:0;border-radius:0;border-bottom:.5px solid var(--sep)}
.sheet .scard>.fold:last-child{border-bottom:0}
.sheet .scard>.fold>summary{padding:12px 14px;min-height:60px}
.sheet .scard>.fold>summary>span:nth-child(2){min-width:0}
.sheet .scard>.fold>.fbody{padding:2px 14px 16px}
.st-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--t3);margin-right:6px;vertical-align:1px}
.st-dot.on{background:#30d158}
.sheet .dng-z{margin-top:22px}
.mi.t-blue,.sheet .fold summary .mi.t-blue{background:rgba(10,132,255,.18);color:#6cb2ff}
.mi.t-green,.sheet .fold summary .mi.t-green{background:rgba(48,209,88,.18);color:#5fdc80}
.mi.t-orange,.sheet .fold summary .mi.t-orange{background:rgba(255,159,10,.18);color:#ffb84d}
.mi.t-purple,.sheet .fold summary .mi.t-purple{background:rgba(191,90,242,.18);color:#d29af7}
.mi.t-red,.sheet .fold summary .mi.t-red{background:rgba(255,69,58,.18);color:#ff7f77}
.mi.t-grey,.sheet .fold summary .mi.t-grey{background:rgba(142,142,147,.18);color:#c7c7cc}
.mkst{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#ff9f0a;box-shadow:0 0 0 2px #1c1c1e}
.wkst{display:flex!important;align-items:center;gap:4px;color:#ffb84d!important;font-weight:600}
.c-del,.dstat b.c-del{color:#ff6b61}
.c-mod,.dstat b.c-mod{color:#ff9f0a}
.coach-t{margin:12px 0 14px;font-size:15.5px;line-height:1.45}
.coach-t b{font-weight:700}
.csig{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:.5px solid var(--sep);font-size:14px}
.csig:first-of-type{border-top:0}
.csig i{flex:none;width:10px;height:10px;border-radius:50%}
.csig i.sg-ok{background:#30d158}.csig i.sg-warn{background:#ffd60a}.csig i.sg-bad{background:#ff5e4e}
.csig b{margin-left:auto;font-weight:600;font-size:13px;color:var(--t2);text-align:right}
.zn{color:var(--t3);font-size:12px}
.ef-t{display:flex;align-items:baseline;gap:8px}
.ef-t b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.ef-t span{font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums}
.ef-bar{position:relative;height:6px;margin-top:10px;border-radius:3px;background:linear-gradient(90deg,#30d158,#ffd60a 45%,#ff9f0a 70%,#ff5e4e)}
.ef-bar i{position:absolute;top:-4px;width:6px;height:14px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px #1f1f23}
.ef-hr{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep);font-size:13.5px;color:var(--t2)}
.ef-hr b{color:var(--t1);font-weight:600;text-align:right}
.ad-v{font-size:12.5px;font-weight:700}
.plan-note{margin:12px 0 0;font-size:13px;color:var(--t2)}
.phd{border-top:.5px solid var(--sep)}
.phd:first-of-type{border-top:0}
.phd>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:44px;font-size:14.5px;cursor:pointer}
.phd>summary::-webkit-details-marker{display:none}
.phd>summary i{flex:none;width:12px;height:12px;border-radius:4px}
.phd>summary b{font-weight:600}
.phd>summary .muted{font-size:13px}
.phd>summary::after{content:'';margin-left:auto;width:7px;height:7px;border-right:2px solid var(--t3);border-bottom:2px solid var(--t3);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.phd[open]>summary::after{transform:rotate(-135deg)}
.phd p{margin:0 0 12px 22px;color:var(--t2);font-size:13.5px}
.pblk{position:relative;background:var(--card);border-radius:18px;margin:0 0 12px;overflow:hidden;scroll-margin-top:12px}
.pblk.cur{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.pblk.past:not([open])>summary .bt b{color:var(--t2)}
.pblk .pg{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.07)}
.pblk .pg i{display:block;height:100%;background:var(--good)}
.pblk[open]>summary .pg{display:none}
.pblk>summary{position:relative;list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:68px;cursor:pointer}
.pblk>summary:active{background:rgba(255,255,255,.04)}
.pblk>summary::-webkit-details-marker{display:none}
.pblk>summary::after{content:'';flex:none;width:8px;height:8px;border-right:2px solid var(--t3);border-bottom:2px solid var(--t3);transform:rotate(45deg);transition:transform .2s;margin:0 4px 0 2px}
.pblk[open]>summary::after{transform:rotate(-135deg)}
.pblk .bt{flex:1;min-width:0}
.pblk .bt b{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.pblk .bt .now{margin:0}
.pblk .bt small{display:block;margin-top:2px;color:var(--t2);font-size:12.5px}
.pblk .bh{flex:none;text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pblk .bh small{display:block;margin-top:2px;color:var(--t2);font-size:12px;font-weight:500}
.pblk .bh small.ok{color:var(--good)}
.pblk .bg{margin:0;padding:0 16px 12px;font-size:13.5px;color:var(--t2)}
.pblk .wks{background:none;border-radius:0;border-top:.5px solid var(--sep)}
.wks{background:var(--card);border-radius:18px;overflow:hidden}
.wk{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 14px;min-height:64px;border-bottom:.5px solid var(--sep)}
.wk:last-child{border-bottom:0}
.wk.cur{background:rgba(255,255,255,.07)}
.wn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.wk.cur .wn{background:var(--t1);color:#000}
.wm{flex:1;min-width:0}
.wm b{display:block;font-size:15px;font-weight:600}
.wm small{display:block;color:var(--t2);font-size:12.5px;margin-top:1px}
.wh{flex:none;width:76px;text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.wh .bar{height:5px;margin-top:6px}
.wd{flex:none;width:34px;text-align:center;font-size:12.5px;color:var(--t2);font-variant-numeric:tabular-nums}
.wd.ok{width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;margin:0 5px}

textarea{width:100%;min-height:120px;resize:vertical;background:var(--card2);color:var(--t1);border:0;border-radius:14px;padding:12px;font:16px/1.4 inherit;font-family:inherit}
textarea:focus{outline:2px solid #5a5a5e}

/* ---------- Feuille réglages / toast ---------- */
.sheet-bg{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90%;overflow:auto;background:#1c1c1e;border-radius:22px 22px 0 0;
  padding:18px 16px calc(24px + var(--sab));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.on .sheet{transform:none}
.sheet h2{margin:0;font-size:22px;font-weight:800}
.sheet h4{margin:20px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);font-weight:600}
.sheet p{margin:0 0 10px;font-size:14.5px;color:#d3d2ca}
.btn{height:48px;border-radius:14px;border:0;background:var(--card2);color:var(--t1);font-size:16px;font-weight:600;padding:0 16px;width:100%;margin:0 0 8px}
.btn.pri{background:var(--t1);color:#000}
.btn.dng{color:#ff7a70}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn{margin:0}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translate(-50%,20px);background:#3a3a3c;color:#fff;padding:10px 16px;border-radius:14px;
  font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.install{display:flex;gap:12px;align-items:flex-start}
.install p{margin:0;font-size:14px;color:#d3d2ca}
.install b{color:var(--t1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){h1{font-size:38px}}
/* ================= Design v2 : socle ================= */
:root{--bg:#000;--card:#141416;--card2:#1f1f23;--card3:#2a2a30;--sep:rgba(255,255,255,.08);--brd:rgba(255,255,255,.07);--r:24px;--t2:#a8a8b0;--t3:#7e7e87}
body::before{content:'';position:fixed;left:0;right:0;top:0;height:460px;z-index:-1;pointer-events:none;background:radial-gradient(80% 100% at 50% 0%,rgba(76,96,170,.20),transparent 70%)}
html{scroll-behavior:smooth}
#view{padding:calc(var(--sat) + 10px) 16px calc(108px + var(--sab))}
#view.enter>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.04s}#view.enter>*:nth-child(3){animation-delay:.08s}#view.enter>*:nth-child(4){animation-delay:.12s}#view.enter>*:nth-child(5){animation-delay:.16s}#view.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
h1{font-size:32px;letter-spacing:-.035em}
.top{margin:4px 0 18px;align-items:center;gap:10px}
.top-t{flex:1;min-width:0}
.top .eyebrow{margin-bottom:1px}
.iconbtn{background:var(--card);box-shadow:inset 0 0 0 1px var(--brd);transition:transform .15s,background .15s}
.iconbtn:active{transform:scale(.92);background:var(--card2)}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:0 0 16px;box-shadow:inset 0 0 0 1px var(--brd)}
.card h2{font-size:18px;margin-bottom:14px}
.sh{display:flex;align-items:center;gap:10px;margin:24px 2px 10px}
.sh h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sh .muted{margin-left:auto}
.lnk{margin-left:auto;display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--t2);font-size:14px;font-weight:600;padding:6px 0 6px 10px}
.mi{flex:none;width:44px;height:44px;border-radius:14px;background:var(--card3);display:grid;place-items:center}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px}
/* barre d'onglets */
.tabbar{background:rgba(12,12,14,.8);border-top:1px solid var(--brd)}
.tab{min-height:58px;gap:2px;font-size:10.5px;padding:7px 0 5px}
.tab .ti{width:58px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tab[aria-selected=true] .ti{background:rgba(255,255,255,.14)}
/* boutons */
.btn{height:52px;border-radius:16px;font-size:16px;font-weight:650;transition:transform .12s,opacity .12s;background:var(--card3)}
.btn:active{transform:scale(.98);opacity:.9}
.btn.pri{background:var(--t1);color:#000}
.chip{background:var(--card3);font-size:12px;padding:4px 10px}
/* accueil : compte à rebours + anneau */
.hero2{display:flex;align-items:center;gap:14px;padding:20px 18px;background:radial-gradient(120% 140% at 0% 0%,rgba(80,110,200,.24),transparent 60%),linear-gradient(165deg,#1b1d27,#101114)}
.hero2 .h2l{flex:1;min-width:0}
.hero2 .big{font-size:78px;line-height:.95;font-weight:800;letter-spacing:-.05em;margin-top:6px;font-variant-numeric:tabular-nums}
.hero2 .unit{font-size:14px;font-weight:600;color:var(--t2);margin-top:4px}
.cd2{display:flex;gap:6px;margin-top:14px;font-size:12.5px;color:var(--t2)}
.cd2 span{background:rgba(255,255,255,.07);border-radius:10px;padding:5px 9px;white-space:nowrap}
.cd2 b{color:var(--t1);font-variant-numeric:tabular-nums;font-size:15px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rc{position:absolute;left:0;right:0;top:0;bottom:0;display:grid;place-content:center;text-align:center}
.ring .rc b{font-size:23px;font-weight:800;line-height:1}
.ring .rc small{font-size:11px;color:var(--t2);margin-top:2px}
/* bandeau de la semaine */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 16px}
.wd7{border:0;background:var(--card2);border-radius:18px;padding:9px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;transition:transform .12s}
.wd7:active{transform:scale(.95)}
.wd7 .dl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--t3)}
.wd7 .dn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.wd7.today{background:rgba(255,255,255,.11)}
.wd7.today .dn{background:var(--t1);color:#000}
.wd7 .dd{display:flex;gap:3px;height:7px;align-items:center;justify-content:center}
.wd7 .dd i{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--c);background:transparent}
.wd7 .dd i.d{background:var(--c)}
.wd7.rest .dd i{box-shadow:none;background:transparent}
/* cartes de séance */
.sess{border-radius:22px;box-shadow:inset 0 0 0 1px var(--brd);background:var(--card);position:relative;margin:0 0 12px}
.sess::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.sess.sp-rest::before,.sess.sp-str::before{opacity:.5}
.s-main{padding:15px 4px 15px 18px;gap:14px}
.s-ic{width:48px;height:48px;border-radius:15px}
.s-ov{display:block;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
.s-t{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:1px;line-height:1.25}
.s-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mc{font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--t2);white-space:nowrap}
.mc.dur{background:var(--cb);color:var(--c)}
.s-sum{display:block;font-size:13px;color:var(--t2);margin-top:7px;line-height:1.35}
.chk{width:62px}
.chk i{width:34px;height:34px;border-color:#55555d}
.chk[aria-checked=true] i{animation:pop .32s}
.sess.done .s-t{color:var(--t2)}
.sess.done .s-ic{opacity:.55}
.s-det{padding:2px 18px 18px;border-top:1px solid var(--sep)}
.sess.open{background:linear-gradient(180deg,var(--card),#111113)}
/* menu « Plus » et groupes repliables */
.menu{background:var(--card);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--brd);overflow:hidden;margin:0 0 16px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:14px 16px;border-bottom:1px solid var(--sep);color:var(--t1)}
.mrow:last-child{border-bottom:0}
.mrow:active{background:rgba(255,255,255,.05)}
.mrow b{display:block;font-size:16px;font-weight:650}
.mrow small{display:block;color:var(--t2);font-size:13px;margin-top:1px;line-height:1.3}
.mrow>svg{color:var(--t3)}
.fold{background:var(--card);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--brd);margin:0 0 16px}
.fold>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 18px;font-weight:650;cursor:pointer}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--t3);border-bottom:2px solid var(--t3);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.fold[open]>summary::after{transform:rotate(-135deg)}
.fold .fbody{padding:0 18px 18px}
.fold summary small{display:block;color:var(--t2);font-weight:500;font-size:12.5px;margin-top:1px}
.sheet{background:#141416;border-radius:28px 28px 0 0}
.sheet::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:-6px auto 14px}
/* vue semaine */
.theme{background:radial-gradient(120% 140% at 0% 0%,rgba(80,110,200,.16),transparent 60%),linear-gradient(165deg,#1a1c24,#121316)}
.theme .t{font-size:19px}
.theme p{font-size:14px;line-height:1.45}
.wprog{margin-top:14px;padding-top:14px;border-top:1px solid var(--sep)}
.wprog .row{margin-bottom:8px}
.day{margin:26px 2px 10px;scroll-margin-top:12px}
.day h3{font-size:21px;font-weight:800}
.legendrpe{font-size:14px;line-height:1.55;color:var(--t2)}
.legendrpe b{color:var(--t1)}
.fold summary>svg{flex:none;color:var(--t2)}
/* réglages + bienvenue */
.sheet .fold{background:var(--card2);box-shadow:none;margin:0 0 10px;border-radius:20px}
.sheet .fold .fbody{padding:0 16px 16px}
.sheet .fold .fbody>h4{display:none}
.sheet .fold .fbody>p:first-child{margin-top:0}
.sheet .fold summary .mi{background:var(--card3);width:36px;height:36px;border-radius:11px;flex:none}
.sheet .inp input,.sheet textarea{background:var(--card3)}
.sheet .dng-z{margin:18px 0 6px}
.wl{text-align:center;padding:6px 4px 0}
.wl .logo{width:76px;height:76px;border-radius:22px;margin:4px auto 14px;display:grid;place-items:center;background:linear-gradient(150deg,#3b4a86,#1b2036);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.wl h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.wl .lead{color:var(--t2);font-size:15.5px;line-height:1.45;margin:0 12px 20px}
.wl ul{list-style:none;margin:0 0 20px;padding:0;text-align:left}
.wl li{display:flex;gap:14px;align-items:flex-start;padding:10px 4px}
.wl li .mi{width:42px;height:42px;border-radius:13px;background:var(--card3)}
.wl li b{display:block;font-size:15.5px}
.wl li div>span{display:block;color:var(--t2);font-size:13.5px;line-height:1.35;margin-top:1px}
.wl li .mi{display:grid;place-items:center;flex:none}
.wl .btn{margin:0 0 10px}
/* états vides */
.empty{text-align:center;padding:26px 20px 22px}
.empty .mi{width:60px;height:60px;border-radius:19px;margin:0 auto 14px}
.empty h2{font-size:21px;margin:0 0 6px}
.empty>p{color:var(--t2);font-size:14.5px;line-height:1.45;margin:0 auto 16px;max-width:30em}
.empty .req{text-align:left;border-top:1px solid var(--sep);padding:14px 0;margin:0}
.empty .req:last-of-type{padding-bottom:2px}
.empty .btn{margin:16px 0 0}
/* accessibilité clavier + divers */
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.75);outline-offset:2px;border-radius:12px}

<script>
'use strict';
(function(){

/* =====================================================================
   1. CONSTANTES & OUTILS

/* Profil de test : uniquement en local (localhost, 127.0.0.1, fichier). http://localhost:8080/?profil=nom ouvre un espace
   isolé (stockage séparé, sans connexion Google, sans statistiques ni synchronisation). Voir DEV.md. Ignoré partout ailleurs. */
var DEV=(function(){
  if(!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)&&!/^file:/.test(location.protocol))return '';
  var m=/[?&]profil=([\w-]{1,24})(?:&|$)/.exec(location.search||'');

})();
var KEY='ironman-sables-2027:v1'+(DEV?':dev-'+DEV:'');
if(DEV){
  try{
    if(/[?&]reset=1(?:&|$)/.test(location.search)){                          // ?profil=nom&reset=1 : repart de zéro puis retire le paramètre
      localStorage.removeItem(KEY);

  var n=Math.max(1,Math.min(maxN,Math.floor((main+rest)/(blk+rest)))),used=n*blk+(n-1)*rest;
  return {n:n,fill:Math.max(0,main-used)};
}
function fill(b,txt){return b.fill>=8?[txt.replace('{x}',b.fill)]:[];}
var WU_BIKE='Échauffement 15 min : 5 min très facile {b:soft}, 5 min progressif jusqu’en zone 2, puis 3 × 1 min à 100 tr/min (récup 1 min)';
var CD_BIKE='Retour au calme 10 min : très souple {b:soft}, cadence 90 tr/min, étire-toi les hanches en descendant du vélo';
var WU_RUN='Échauffement 10 min : 5 min très facile {r:soft} + 5 min en zone 2 {r:z2}, puis gammes (2 × 20 m montées de genoux, talons-fesses, pas chassés)';

/* ---- Natation ---- */
// wk = séance structurée (syntaxe d'intervals.icu) : les cibles {S:..} {B:..} {R:..} sont remplacées à l'envoi (voir wkTgt)
function WK(a){return a.join('\n');}
function repW(n,work,rest){return n>1?(n-1)+'x\n'+work+'\n'+rest+'\n\n'+work:work;}
function swimSession(title,tag,goal,segs,sum,extra,wk){
  var tot=0,lines=[];segs.forEach(function(s){lines.push(s[0]);tot+=s[1];});
  return S('swim',title,tag,Math.max(15,R5(tot*22/1000)),lines.concat(extra||[]),{m:tot,sum:sum,goal:goal,wk:wk});
}

    return S('bike','Vélo · Sortie souple','Récup',t,[t+' min en endurance facile {b:soft}, cadence 90 tr/min','Au milieu : 6 × 20 s de cadence vive (100 tr/min et plus), sans forcer, récup 40 s','Route plate ou home-trainer'],{sum:t+' min facile',goal:'Faire circuler les jambes pour récupérer.',wk:WK(['Main','- '+t+'m {B:soft}'])});

}

function buildPlan(){

        v[2]>0?[bikeMid(rw,kind,ph,v[2])]:[],
        v[3]>0?[runMid(rw,kind,ph,v[3])]:[],
        v[1]>0?[swimB(rw,kind,ph,v[1])]:[],
        (v[4]>0?[bikeLong(rw,kind,ph,v[4])]:[]).concat(v[5]>0?[brick(rw,kind,ph,v[5])]:[]),
        v[6]>0?[runLong(rw,kind,ph,v[6])]:[]

      days.forEach(function(l,di){if(!l.length){var rs=restDay(w);rs.fr=1;days[di]=[rs];}});     // jour sans séance : repos (disponible pour recevoir une séance déplacée)
    }
    var start=addDays(PLAN_START,(w-1)*7),wk={n:w,start:start,kind:kind,theme:meta[1],ph:phaseOf(w),days:[],min:0,m:0,count:0};
    for(d=0;d<7;d++){

        var s=list[i];s.id=w+'.'+d+'.'+s.sp;s.w=w;s.d=d;
        if(!IS_SABLES){s.title=gx(s.title);s.tag=gx(s.tag);s.sum=gx(s.sum);s.goal=gx(s.goal);if(s.tip)s.tip=gx(s.tip);s.lines=s.lines.map(gx);}
        if(s.sp!=='rest'){wk.count++;wk.min+=s.min;wk.m+=s.m;}

    }

}

   Zones : celles d’intervals.icu (souvent 7 zones de FC, les zones 5 et plus sont regroupées à l’affichage). Allures / vitesses à une FC donnée : régression sur tes sorties des 26

var APc={k:'',v:null};
function autoProf(){
  var sv=state.sv||{},acts=sv.acts||[],m=sv.meta||{},hz=sv.hrz||m.hrz;
  if(!acts.length||!hz||hz.length<5)return null;
  var key=acts.length+':'+(acts[0]&&acts[0].id)+':'+JSON.stringify(state.ui.race||{})+':'+hz.join(',');
  if(APc.k===key)return APc.v;
  var all=dataActs(),P=raceParams(),E=estRace(all,Object.assign({},P,{scen:'real'}),null),base=idxOfDate(today()),ap={hz:hz,P:P};
  var win=all.filter(function(a){var d=dayIdx(a);return d<=base&&d>base-182;});
  var rr=win.filter(function(a){return a.t!=='VirtualRun'&&/Run/.test(a.t)&&a.m>=4000&&a.d>=1500&&a.h>0;}).map(function(a){return [a.m/a.d,a.h,a.z/a.m*1000,wtOf(a,base)];});
  var fr=fitLin(rr);
  if(fr&&fr.c[1]>0.005&&fr.r2>0.15){var er=medianOf(rr.map(function(r){return r[2];}));ap.runAt=function(hr){var v=fr.c[0]+fr.c[1]*hr+fr.c[2]*er;return v>0.5?Math.max(270,Math.min(540,1000/v)):null;};}
  var rb=win.filter(function(a){return a.t!=='VirtualRide'&&/Ride/.test(a.t)&&a.m>=15000&&a.d>=2700&&a.h>0;}).map(function(a){return [a.m/a.d*3.6,a.h,a.z/a.m*1000,wtOf(a,base)];});
  var fb=fitLin(rb);

function bpmTxt(a,b){return a?a+'–'+b+' bpm':'≤ '+b+' bpm';}
function autoTok(t,k,ap,p){

  if(t==='r'&&!(p.fc||p.thr)){

    if(!d)return null;
    o.push(d[0],bpmTxt(d[1],d[2]));
    if(k==='im'){if(ap.imRun)o.push(mmss(ap.imRun*0.97)+'–'+mmss(ap.imRun*1.03)+' /km');}
    else if(ap.runAt){var pa=ap.runAt(d[2]),pb=ap.runAt(d[1]||d[2]-10);if(pa&&pb)o.push((k==='soft'?'plus lent que '+mmss(pa):mmss(pa)+'–'+mmss(pb))+' /km');}

  if(t==='b'&&!p.ftp){

    if(!d)return null;

    else if(ap.bikeAt&&k!=='soft'){var sa=ap.bikeAt(d[1]),sb=ap.bikeAt(d[2]);if(sa&&sb)o.push(Math.round(sa)+'–'+Math.round(sb)+' km/h');}
    return '('+o.join(' · ')+')';
  }

    var im=ap.imSwim,cs=ap.css||im-10,r={easy:['RPE 3–4',im+6,im+14],end:['RPE 4–5',im,im+6],im:['RPE 5',im-3,im+3],css:['RPE 7',cs-1,cs+1],fast:['RPE 8',cs-6,cs-2]}[k];
    if(!r)return null;

function tx(str){

      if(p.ftp)o.push('≈ '+(z[1]?Math.round(p.ftp*z[1])+'–':'< ')+Math.round(p.ftp*z[2])+' W');

function computeLinks(){
  var acts=((state.sv&&state.sv.acts)||[]).filter(function(a){return a&&a.s;}),man=state.links||{},s2a={},a2s={},used={},pairs=[];
  acts.forEach(function(a){var m=man[a.id];if(m===undefined)return;used[a.id]=1;a2s[a.id]=m||0;if(m)s2a[m]=a;});
  var bikes=acts.filter(function(a){return actSport(a)==='bike';});
  acts.forEach(function(a){
    var k=actSport(a);if(used[a.id]||!k||a.d<600)return;
    var ai=dayIdx(a),aw=Math.floor(ai/7),ab=false,st=plLocal(a.s);
    if(ai<0)return;
    if(k==='run')ab=bikes.some(function(b){var bs=plLocal(b.s);if(!bs||dayIdx(b)!==ai)return false;var gap=(st-(bs.getTime()+(b.e||b.d)*1000))/6e4;return gap>=-5&&gap<=60;});
    ALLS.forEach(function(s){
      if(s2a[s.id]||state.done[s.id])return;
      var sw=s.w-1;if(sw>aw||sw<aw-1)return;
      if(!(k===s.sp||(k==='run'&&s.sp==='brick'&&ab)))return;
      var si=sw*7+s.d,r=k==='swim'?a.m/(s.m||1):a.d/60/(s.min||1);
      if(r<0.5)return;
      pairs.push([Math.abs(si-ai)+Math.abs(Math.log(r))*4+(k==='run'&&s.sp==='run'&&ab?3:0)+(sw<aw?1.5:0),a,s]);
    });
  });
  pairs.sort(function(x,y){return x[0]-y[0];});
  pairs.forEach(function(p){var a=p[1],s=p[2];if(used[a.id]||s2a[s.id])return;used[a.id]=1;s2a[s.id]=a;a2s[a.id]=s.id;});
  LK={s2a:s2a,a2s:a2s};
}
function isDone(s){return !!(state.done[s.id]||LK.s2a[s.id]);}
function doneMin(s){var a=LK.s2a[s.id];return a?Math.round(a.d/60):s.min;}
function doneM(s){var a=LK.s2a[s.id];return a?a.m:s.m;}
function actBlock(s){
  if(s.sp==='rest'||s.sp==='race')return '';
  var a=LK.s2a[s.id],sv=state.sv||{};
  if(a)return '<div class="act"><b>Activité Garmin</b><div class="an">'+esc(a.n)+'</div><div class="small muted">'+esc(actDate(a)+' · '+actLine(a))+'</div><button class="btn" style="margin:10px 0 8px" data-act="actdetail" data-aid="'+esc(a.id)+'">Voir le détail de l’activité</button><div class="btns"><button class="btn" data-act="pickact" data-sid="'+s.id+'">Changer</button><button class="btn" data-act="unlink" data-aid="'+esc(a.id)+'">Dissocier</button></div></div>';
  if(sv.url&&sv.key)return '<div class="act"><b>Activité réalisée</b><div class="small muted">Aucune activité associée'+(state.done[s.id]?' (cochée à la main)':'')+'.</div><button class="btn" style="margin:10px 0 0" data-act="pickact" data-sid="'+s.id+'">Associer une activité Garmin</button></div>';

}

function status(){
  var t=today(),d=diffDays(t,PLAN_START),rd=diffDays(RACE_DATE,t);
  if(d<0)return {s:'before',w:1,days:-d};
  if(rd<0)return {s:'after',w:NW};

}
function wkStats(wk){
  var r={n:0,d:0,min:0,dmin:0,m:0,dm:0};
  wk.days.forEach(function(day){day.sessions.forEach(function(s){
    if(s.sp==='rest')return;
    var ok=isDone(s);r.n++;r.min+=s.min;r.m+=s.m;
    if(ok){r.d++;r.dmin+=doneMin(s);r.dm+=doneM(s);}
  });});

}
function stats(){
  var t={n:0,d:0,min:0,dmin:0},sp={swim:{m:0,dm:0,min:0,dmin:0},bike:{min:0,dmin:0},run:{min:0,dmin:0},str:{min:0,dmin:0}};
  PLAN.forEach(function(wk){wk.days.forEach(function(day){day.sessions.forEach(function(s){
    if(s.sp==='rest')return;
    var ok=isDone(s),k=s.sp==='brick'?'run':s.sp;
    t.n++;t.min+=s.min;if(ok){t.d++;t.dmin+=doneMin(s);}
    if(sp[k]){sp[k].min+=s.min;if(ok)sp[k].dmin+=doneMin(s);if(k==='swim'){sp.swim.m+=s.m;if(ok)sp.swim.dm+=doneM(s);}}
  });});});
  return {t:t,sp:sp};

var TABS=[['dash','Accueil','home'],['week','Semaine','week'],['data','Données','chart'],['race','Course','race'],['more','Plus','more']];
var TABNAMES=['dash','week','data','race','more','plan','admin'];
function tabOf(t){return t==='plan'||t==='admin'?'more':t;}
/* Routage par URL : #onglet ou #week?w=12&d=3 (semaine 12, jour 3 = jeudi) */
function parseRoute(){
  var h=(location.hash||'').slice(1),q=h.indexOf('?'),p={};
  if(q>=0)h.slice(q+1).split('&').forEach(function(kv){var a=kv.split('=');if(a[0])p[a[0]]=decodeURIComponent(a[1]||'');});
  return {tab:q<0?h:h.slice(0,q),p:p};
}
var tab=state.ui.tab||'dash',wv=status().w,sel=null,openSet={},pendDay=null;
function applyRoute(){
  var r=parseRoute();
  if(TABNAMES.indexOf(r.tab)>=0)tab=r.tab;
  if(TABNAMES.indexOf(tab)<0)tab='dash';
  if(tab==='week'){
    var w=parseInt(r.p.w,10),d=parseInt(r.p.d,10);
    if(w>=1&&w<=NW)wv=w;
    pendDay=(d>=0&&d<=6)?d:null;
  }
}
/* Fenêtres : #week?w=12&s=act:ID (settings, legal, away, acts, act:ID, assoc:ID, link:SID) */
var sheetKey=null,sheetDepth=0,routing=false;
function routeHash(day){
  var q=[];
  if(tab==='week'){q.push('w='+wv);if(day!=null)q.push('d='+day);}
  if(sheetKey)q.push('s='+encodeURIComponent(sheetKey));
  return '#'+tab+(q.length?'?'+q.join('&'):'');
}
function syncUrl(push,day){
  if(routing)return;
  var h=routeHash(day),r=parseRoute();
  if(day==null&&r.tab===tab&&(tab!=='week'||+r.p.w===wv)&&(r.p.s||null)===sheetKey)return; /* même page : on garde &d= éventuel */
  if(location.hash===h)return;
  try{history[push?'pushState':'replaceState'](null,'',h);}catch(e){}
}
function sheetRoute(k){
  if(sheetKey===k)return;
  sheetKey=k;
  if(routing)return;
  sheetDepth++;syncUrl(true);
}
function openSheetByKey(k){
  var i=k.indexOf(':'),n=i<0?k:k.slice(0,i),v=i<0?'':k.slice(i+1);
  if(n==='settings')openSheet();
  else if(n==='legal')openLegal();
  else if(n==='away')openAwayList();
  else if(n==='acts')openAllActs();
  else if(n==='level')openLevel();
  else if(n==='steps')openSteps();
  else if(n==='act')openActDetail(v);
  else if(n==='assoc')openPickSess(v);
  else if(n==='link')openPickAct(v);
}
function onRoute(){
  var r=parseRoute(),w=parseInt(r.p.w,10),s=r.p.s||null;
  if(r.tab===tab&&(tab!=='week'||w===wv)&&r.p.d==null&&s===sheetKey)return;
  routing=true;
  try{
    applyRoute();state.ui.tab=tab;save();
    if(!s){sheetDepth=0;if(sheetKey){sheetKey=null;document.getElementById('sheetbg').classList.remove('on');}}
    else sheetDepth=sheetDepth>0?Math.max(1,sheetDepth-1):0;
    render(false);
    if(s&&s!==sheetKey)openSheetByKey(s);
  }finally{routing=false;}
}

function heroHtml(st){
  var art='<div class="h3-bg" style="--pos:50% 40%"><img src="'+HERO_IMG+'" alt=""></div><div class="h3-shade"></div>',big='style="font-size:44px;margin:10px 0 6px;letter-spacing:-.03em"',cls='card hero2 hero3 photo';
  if(st.s==='raceday')return '<section class="'+cls+'">'+art+'<div class="h3-in"><div class="h3-center"><div class="eyebrow">Jour J</div><div class="big" '+big+'>C’est aujourd’hui</div><div class="small" style="color:rgba(255,255,255,.8)">'+esc(RNAME)+' · '+esc(fmtLong(RACE_DATE))+'</div></div></div></section>';

  var elapsed=st.s==='before'?0:Math.min(NW*7,diffDays(today(),PLAN_START)+1);
  return '<section class="'+cls+'" aria-label="Compte à rebours">'+art+'<div class="h3-in"><div class="h3-top"><div class="h2l"><div class="eyebrow">'+esc(RNAME)+' · '+fmtDay(RACE_DATE)+' '+RACE_DATE.getFullYear()+'</div><div class="big" id="cd-d">–</div><div class="unit"><span id="cd-u">jours</span> avant la course</div>'+

}
function todayHtml(st,cur){
  var t=today(),h='';
  if(st.s==='raceday'||st.s==='after')return '';
  if(st.s==='before')
    return '<div class="sh"><h2>Prochainement</h2></div><section class="card"><div class="row" style="align-items:flex-start"><div class="mi">'+ic('week',22)+'</div><div><b style="font-size:17px">Le programme démarre dans '+st.days+' jour'+(st.days>1?'s':'')+'</b><div class="small muted" style="margin-top:2px">'+esc(fmtLong(PLAN_START))+' · semaine 1 : reprise douce.</div></div></div><button class="btn pri" style="margin:16px 0 0" data-act="gowk" data-w="1">Voir la semaine 1</button></section>';
  var day=cur.days.filter(function(d){return diffDays(d.date,t)===0;})[0],list=day?day.sessions.filter(function(s){return s.sp!=='rest';}):[];
  h+='<div class="sh"><h2>Aujourd’hui</h2><span class="muted small">'+esc(fmtDay(t))+'</span></div>';
  if(list.length){list.forEach(function(s){h+=sessCard(s,true);});return h;}
  var nx=nextSession(cur);
  h+='<section class="card"><div class="row" style="align-items:flex-start"><div class="mi">'+ic('rest',22)+'</div><div><b style="font-size:17px">Jour de repos</b><div class="small muted" style="margin-top:2px">Dors bien, hydrate-toi : c’est là que tu progresses.</div></div></div>'+
    (nx?'<button class="next sp-'+nx.s.sp+'" data-act="gowk" data-w="'+st.w+'" style="margin-top:14px"><span class="ico">'+ic(nx.s.sp,22)+'</span><span style="flex:1;min-width:0"><span class="eyebrow" style="display:block;font-size:11px">Prochaine séance · '+esc(nx.day)+'</span><b style="display:block;font-size:15.5px;font-weight:650;margin-top:2px">'+esc(nx.s.title)+'</b></span>'+ic('right',20)+'</button>':'')+'</section>';
  return h;
}
function homeActs(){
  var sv=state.sv,acts=(sv.acts||[]).filter(function(a){return actSport(a);}).sort(function(x,y){return y.s>x.s?1:-1;}).slice(0,2);
  var off=sv.err||sv.werr||sv.conn===false,h='<div class="sh"><h2>Dernières activités</h2><span class="sync-s'+(off?' off':'')+'"><i></i>'+(off?'Hors ligne':'Synchro '+ago(sv.t))+'</span></div>';
  if(!acts.length)return h+'<section class="card"><p class="small muted" style="margin:0">Aucune activité pour l’instant. Elles apparaissent ici après chaque sortie synchronisée par Garmin.</p></section>';
  h+='<section class="card" style="padding-bottom:8px">';
  acts.forEach(function(a){
    var sid=LK.a2s[a.id],s=sid&&SBY[sid],lab=dayIdx(a)<0?'Avant le plan':s?'→ '+sessLabel(s):sid===0?'Ignorée':'Non associée';
    h+='<button class="srow" data-act="actdetail" data-aid="'+esc(a.id)+'"><span class="sr-t"><b>'+esc(a.n||a.t)+'</b><small>'+esc(actDate(a)+' · '+actLine(a))+'</small></span><span class="sr-b'+(s?' ok':'')+'">'+esc(lab)+'</span></button>';
  });
  return h+'<button class="btn" data-act="allacts" style="margin:10px 0 6px">Toutes mes activités ('+(sv.acts||[]).length+')</button></section>';
}

function applyAway(skip,skipStep){

    if(!s.orig)return;
    var o=s.orig;Object.keys(s).forEach(function(k){delete s[k];});Object.assign(s,o);
  });
  PLAN.forEach(function(wk){wk.days.forEach(function(day,i){day.sessions=wk.layout[i].slice();day.sessions.forEach(function(s){s.w=wk.n;s.d=i;delete s.moved;});});});

        Object.assign(s,op.nf,{id:id,w:w,d:d,orig:snap,adapt:{mode:p.mode,label:p.label,pid:p.id}});
      }
      if(op.to!==null){var pos=ORIGPOS[s.id];moveSess(s,op.to,(pos.w-1)*7+pos.d,p);}

/* ---------- Choisir sa course (premier lancement ou changement de course) ---------- */
/* ---------- Sauvegarde cloud chiffrée (sans compte) ----------
   Un « code de récupération » (130 bits, généré ici, jamais envoyé) donne : une adresse (id), une preuve d'écriture (wk) et une clé AES-GCM.
   Le serveur ne stocke qu'un blob chiffré : il ne peut ni lire tes séances ni t'identifier. Perdre le code = perdre la sauvegarde cloud
   (les données restent sur l'appareil). La clé intervals.icu n'est JAMAIS sauvegardée. */
var B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function newCode(){
  var b=new Uint8Array(17),i,bits='',out='';crypto.getRandomValues(b);
  for(i=0;i<b.length;i++)bits+=('00000000'+b[i].toString(2)).slice(-8);
  for(i=0;i+5<=130;i+=5)out+=B32[parseInt(bits.slice(i,i+5),2)];
  return out;
}
function normCode(c){return String(c||'').toUpperCase().replace(/O/g,'0').replace(/[IL]/g,'1').replace(/[^0-9A-Z]/g,'').replace(/U/g,'V');}
function fmtCode(c){return c.replace(/(.{5})/g,'$1-').replace(/-$/,'');}
function validCode(c){return c.length===26&&c.split('').every(function(x){return B32.indexOf(x)>=0;});}
function hexOf(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
function sha(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));}
function b64(buf){var s='',a=new Uint8Array(buf),i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function cloudKeys(code){
  return Promise.all([sha('id:'+code),sha('w:'+code),sha('enc:'+code)]).then(function(r){
    return crypto.subtle.importKey('raw',r[2],{name:'AES-GCM'},false,['encrypt','decrypt']).then(function(k){return {id:hexOf(r[0]),wk:hexOf(r[1]),key:k};});
  });
}
function cloudBase(){return (state.ui&&state.ui.pubApi)||PUB_API;}
function cloudPayload(){
  var u=state.ui||{};
  return {app:'plan-triathlon',v:1,done:state.done,links:state.links,race:state.race||(SETUP?null:CFG),prof:u.prof||{},lv:u.lvl||{},st:u.steps||[],away:u.away||[],rc:u.race||{}};
}
function cloudEncrypt(keys,obj){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},keys.key,new TextEncoder().encode(JSON.stringify(obj))).then(function(ct){
    var all=new Uint8Array(12+ct.byteLength);all.set(iv,0);all.set(new Uint8Array(ct),12);return b64(all);
  });
}
function cloudDecrypt(keys,blob){
  var a=unb64(blob);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},keys.key,a.slice(12)).then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}
function cloudCall(keys,method,body){
  var o={method:method,headers:{'Content-Type':'application/json','X-Sync-Write':keys.wk}};if(body)o.body=JSON.stringify(body);
  return fetch(cloudBase()+'/pub/sync/'+keys.id,o).then(function(r){return r.json().then(function(j){j.status=r.status;return j;});});
}
var cloudTimer=null,cloudBusy=false,cloudDraftCode=null;
function cloudCfg(){return state.ui&&state.ui.cloud;}
function save0(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function cloudSchedule(){
  if(DEV)return;
  if(acct()){acctSchedule();return;}
  if(!cloudCfg()||cloudCfg().paused)return;
  clearTimeout(cloudTimer);cloudTimer=setTimeout(function(){cloudPush(false);},20000);
}
// envoi : seulement si les données ont changé depuis la dernière sauvegarde
function cloudPush(loud){
  if(DEV)return Promise.resolve();
  var c=cloudCfg();if(!c||cloudBusy)return Promise.resolve();
  var payload=cloudPayload(),sig=JSON.stringify(payload);
  if(!loud&&sig===c.sig)return Promise.resolve();
  cloudBusy=true;
  return cloudKeys(c.code).then(function(keys){
    return cloudEncrypt(keys,payload).then(function(blob){return cloudCall(keys,'PUT',{blob:blob,base:c.v||0});});
  }).then(function(j){
    if(j.status===409){c.conflict=true;c.paused=true;save0();if(loud)toast('Une version plus récente existe dans le cloud');return;}
    if(!j.ok)throw new Error(j.error||('Erreur '+j.status));
    c.v=j.v;c.t=j.updated||Date.now();c.sig=sig;c.err='';c.conflict=false;save0();
    if(loud)toast('Sauvegarde cloud effectuée');
  }).catch(function(e){c.err=(e&&e.message)==='Failed to fetch'?'Hors ligne':String((e&&e.message)||e);save0();if(loud)toast('Sauvegarde cloud impossible : '+c.err);})
  .then(function(){cloudBusy=false;});
}
function cloudApply(p){
  state.done=p.done||{};state.links=p.links||{};
  state.ui.prof=p.prof||{};state.ui.lvl=p.lv||{};state.ui.steps=p.st||[];state.ui.away=p.away||[];state.ui.race=p.rc||{};
  if(p.race&&p.race.date&&p.race.start)state.race=p.race;
}
// récupération (nouvel appareil ou restauration) : télécharge, déchiffre et remplace les données locales
function cloudRestore(codeRaw,silent){
  var code=normCode(codeRaw);
  if(!validCode(code)){toast('Code invalide : 26 caractères attendus');return;}
  toast('Récupération…');
  cloudKeys(code).then(function(keys){
    return fetch(cloudBase()+'/pub/sync/'+keys.id).then(function(r){return r.json().then(function(j){j.status=r.status;return j;});}).then(function(j){
      if(j.status===404){toast('Aucune sauvegarde pour ce code');return;}
      if(!j.ok||!j.blob)throw new Error(j.error||'Erreur');
      return cloudDecrypt(keys,j.blob).then(function(p){
        if(!silent&&!confirm('Remplacer les données de cet appareil par la sauvegarde cloud ?'))return;
        cloudApply(p);
        state.ui.cloud={code:code,v:j.v,t:j.updated,sig:JSON.stringify(cloudPayload()),err:'',paused:false};
        track('cloud_restore','');
        save0();location.reload();
      });
    });
  }).catch(function(e){toast((e&&e.name==='OperationError')?'Code incorrect':('Échec : '+((e&&e.message)||e)));});
}
function cloudEnable(){
  var code=cloudDraftCode;if(!code)return;
  cloudKeys(code).then(function(keys){
    return cloudEncrypt(keys,cloudPayload()).then(function(blob){return cloudCall(keys,'PUT',{blob:blob,base:0});});
  }).then(function(j){
    if(!j.ok)throw new Error(j.error||('Erreur '+j.status));
    state.ui.cloud={code:code,v:j.v,t:j.updated,sig:JSON.stringify(cloudPayload()),err:'',paused:false};save0();cloudDraftCode=null;
    track('cloud_enabled','');toast('Sauvegarde cloud activée');openSheet();
  }).catch(function(e){toast('Activation impossible : '+(((e&&e.message)==='Failed to fetch')?'serveur injoignable':((e&&e.message)||e)));});
}
// « Sauvegarder maintenant » (après un conflit : on repart de la version du cloud pour l'écraser sciemment)
function cloudForce(){
  var c=cloudCfg();if(!c)return;
  cloudKeys(c.code).then(function(keys){
    return fetch(cloudBase()+'/pub/sync/'+keys.id+'?meta=1').then(function(r){return r.json();}).then(function(m){if(m&&m.ok)c.v=m.v;return cloudPush(true);});
  }).then(function(){openSheet();});
}
// au démarrage : une version plus récente dans le cloud (autre appareil) ?
function cloudBoot(){
  var c=cloudCfg();if(!c)return;
  cloudKeys(c.code).then(function(keys){return fetch(cloudBase()+'/pub/sync/'+keys.id+'?meta=1').then(function(r){return r.json();});}).then(function(m){
    if(!m||!m.ok)return;
    if(m.v>(c.v||0)){
      c.conflict=true;c.paused=true;save0();
      if(JSON.stringify(cloudPayload())===c.sig)cloudRestore(c.code,true);   // rien de modifié ici : on charge simplement la version plus récente
      else toast('Une version plus récente existe dans le cloud (Réglages → Sauvegarde cloud)');
    }else if(JSON.stringify(cloudPayload())!==c.sig)cloudSchedule();
  }).catch(function(){});
}

function wzVerify(){

  wz.busy=true;renderWiz();
  fetch(base+'/api/status',{headers:H}).then(function(r){return r.json().then(function(j){j.status=r.status;return j;});}).then(function(j){
    if(j.status===401||j.connected===false)throw new Error(/refuse/.test(j.error||'')||j.status===401?'intervals.icu refuse cette clé. Vérifie que tu l’as copiée en entier.':(j.error||'Connexion refusée'));

      var acts=a.activities||[];
      state.sv=Object.assign(state.sv||{},{url:base,key:key,acts:acts,meta:a.meta||null,hrz:(a.meta&&a.meta.hrz)||(state.sv&&state.sv.hrz),conn:true,t:Date.now(),err:'',werr:''});
      save();
      if(acts.length&&!state.ui.gtracked){state.ui.gtracked=1;save();track('garmin_connected','');}
      wz.res={ok:true,name:j.athlete||'',count:acts.length,last:acts[0]||null};
    });
  }).catch(function(e){
    var m=(e&&e.message)||'';wz.err=(m==='Failed to fetch'||m==='Load failed')?'Serveur injoignable. Vérifie ta connexion et réessaie.':m||'Échec de la connexion';track('wiz_error','');
  }).then(function(){wz.busy=false;renderWiz();});
}

function acctPing(){

function acctPush(loud){

    if(j.status===409){a.conflict=true;a.paused=true;save0();if(loud)toast('Une version plus récente existe dans ton compte');return;}

  if(raw.charAt(0)!=='(')return out;
  raw.slice(1,-1).split(' · ').forEach(function(p){
    out.push({c:/bpm/.test(p)?'hr':/\/km|\/100|km\/h/.test(p)?'pc':'rpe',t:p.replace(/^≈ /,'').replace(/^RPE\s*/,'Effort ')});
  });
  if(t==='B'){var lb=wkLab('B',k);if(/km\/h$/.test(lb)){out=out.filter(function(c){return !/km\/h/.test(c.t);});out.push({c:'pc',t:lb.replace('-','–').replace('km/h',' km/h')});}}
  var ord={pc:0,hr:1,rpe:2};
  return out.sort(function(a,b){return ord[a.c]-ord[b.c];});
}
function stepRow(st,name){
  var base=(TOKN[st.t]||{})[st.key]||'';
  var nm=name||(st.rest?'Repos':st.sec==='warm'?'Échauffement'+(base?' · '+base.toLowerCase():''):st.sec==='cool'?'Retour au calme'+(base?' · '+base.toLowerCase():''):base||'Bloc');
  var chips=st.rest?[]:chipsFor(st.t,st.key);
  return '<div class="st"><span class="du">'+esc(st.dur)+'</span><div class="bd"><div class="nm">'+esc(nm)+'</div>'+(chips.length?'<div class="chips">'+chips.map(function(c){return '<span class="cp '+c.c+'">'+esc(c.t)+'</span>';}).join('')+'</div>':'')+'</div></div>';
}
function stepsHtml(s){
  var out='';
  wkBlocks(s.wk).forEach(function(r){
    if(r.k==='head')out+='<div class="sub-t">'+esc(r.text)+'</div>';
    else if(r.k==='step')out+=stepRow(r.st);
    else out+='<div class="rep"><div class="rh">'+r.n+' ×</div>'+r.steps.map(function(st,i){return stepRow(st,i>0&&!st.rest?'Récupération':null);}).join('')+'</div>';
  });
  return out;
}
var TIP_SKIP=/^(Échauffement|Corps de séance|Retour au calme|Série \d|Complète en|Durée totale|Toute la sortie|Reste de la sortie|Footing en|Footing très|Endurance|Puis |Dernières 5|Fin de sortie|Entre et après|\d+ (×|min))/i;
function liHtml(l){var t=tx(l),m=/^([^:]{3,44}) : (.+)$/.exec(t);return '<li>'+(m?'<b>'+esc(m[1])+'</b> : '+esc(m[2]):esc(t))+'</li>';}
function detailBody(s){
  var h='',blocks=s.wk?stepsHtml(s):'';
  if(blocks)h+='<div class="sec-t">Déroulé</div>'+blocks;
  var tl=blocks?s.lines.filter(function(l){return !TIP_SKIP.test(l);}):s.lines;
  if(tl.length)h+='<div class="sec-t">'+(blocks?'Conseils':'Détail de la séance')+'</div><ul>'+tl.map(liHtml).join('')+'</ul>';
  return h;
}
function pq(s){return mmss(s).replace(':',"'");}
function swimRange(k){
  var ap=autoProf(),p=state.ui.prof||{},im=ap&&ap.imSwim;if(!im)return null;
  var cs=p.css||ap.css||im-10;
  return {easy:[im+6,im+14],end:[im,im+6],im:[im-3,im+3],css:[cs-1,cs+1],fast:[cs-6,cs-2]}[k]||null;
}
function wkTgt(t,k){
  if(t==='R')return {soft:'Z1 HR',z2:'Z2 HR',tempo:'Z4 HR',im:'Z1-Z2 HR'}[k]||'';   // allure Ironman : FC en plafond (zone 2 max)
  if(t==='B')return {soft:'Z1 HR',z2:'Z2 HR',ft:'Z3 HR',sw:'Z4 HR',im:'Z2 HR'}[k]||'';
  return '';
}
function wkLab(t,k){
  var ap=autoProf();if(!ap)return '';
  if(t==='R'){
    if(k==='im')return ap.imRun?pq(ap.imRun*0.97)+'-'+pq(ap.imRun*1.03)+'/km':'';
    var hz=ap.hz,d={soft:[0,hz[0]],z2:[hz[0]+1,hz[1]],tempo:[hz[2]+1,hz[3]]}[k];
    if(!d||!ap.runAt)return '';
    var pa=ap.runAt(d[1]),pb=ap.runAt(d[0]||d[1]-10);
    if(!pa||!pb)return '';
    return k==='soft'?pq(pa)+'+/km':pq(pa)+'-'+pq(pb)+'/km';
  }
  if(t==='B'){
    var fl={im:1,ft:1.03,sw:1.10}[k];
    if(fl&&ap.imBike){var vl=ap.imBike*fl;return Math.round(vl*0.95)+'-'+Math.round(vl*1.05)+'km/h';}
    var z={z2:2,ft:3,sw:4}[k];
    if(z&&ap.bikeAt){var sa=ap.bikeAt(ap.hz[z-2]+1),sb=ap.bikeAt(ap.hz[z-1]);if(sa&&sb)return Math.round(sa)+'-'+Math.round(sb)+'km/h';}
    return '';
  }
  if(t==='S'){var r=swimRange(k);return r?pq(r[0])+'-'+pq(r[1])+'/100':'';}
  return '';
}
// Allure CIBLE (vraie cible de vitesse sur la montre) : course (blocs tempo et allure Ironman) et natation (tous les blocs).
// Prérequis côté intervals.icu : le « seuil d’allure » du sport (et ses zones d’allure) doit être renseigné, sinon l’allure est supprimée à l’export Garmin.
function wkPace(t,k){
  if(t==='S'){var sr=swimRange(k);return sr?mmss(sr[0])+'-'+mmss(sr[1])+'/100m Pace':'';}
  if(t==='B'){var apb=autoProf(),fb={im:1,ft:1.03,sw:1.10}[k];if(!apb||!apb.imBike||!fb)return '';var vb=apb.imBike*fb;return mmss(3600/(vb*1.05))+'-'+mmss(3600/(vb*0.95))+'/km Pace';}
  var ap=autoProf();if(t!=='R'||!ap)return '';
  var a,b;
  if(k==='im'&&ap.imRun){a=ap.imRun*0.97;b=ap.imRun*1.03;}
  else if(k==='tempo'&&ap.runAt){a=ap.runAt(ap.hz[3]);b=ap.runAt(ap.hz[2]+1);}
  if(!a||!b)return '';
  return mmss(a)+'-'+mmss(b)+'/km Pace';
}
function wkText(wk){
  return wk.split('\n').filter(function(l){var t=l.trim();return !t||t.charAt(0)==='-'||/^\d+x$/.test(t)||/^(warmup|cooldown)$/i.test(t);}).map(function(l){
    var m=/^(\s*-\s)(\d+(?:m|s|mtr|km))\s+\{([RBS]):(\w+)\}\s*$/.exec(l);
    if(m){var pc=wkPace(m[3],m[4]),lab=wkLab(m[3],m[4]);if(pc)return m[1]+(m[3]==='S'&&lab?lab+' ':'')+m[2]+' '+pc;var tg=wkTgt(m[3],m[4]);return m[1]+(lab?lab+' ':'')+m[2]+(tg?' '+tg:'');}
    return l.replace(/\{([RBS]):(\w+)\}/g,function(_,t,k){return wkTgt(t,k);}).replace(/\s+$/,'');
  }).join('\n');
}
// Nom de la séance dans Garmin : jour + date + sport et type de séance + durée (distance pour la natation). Ex. « Jeu 3 juin · Course Allure Ironman · 1h15 »
function evName(s){
  var d=addDays(PLAN_START,sessIdx(s)),dt=DAYS[s.d].slice(0,3)+' '+dnum(d)+' '+MONTHS[d.getMonth()].replace('.','');
  var q=s.sp==='swim'&&s.m?km(s.m)+' km':fm(s.min).replace(/ h /,'h').replace(/ h$/,'h').replace(/ min$/,'min');
  var t=s.title.replace(' · ',' '),n=dt+' · '+t+' · '+q;
  if(n.length>48)n=dt+' · '+t;                                   // trop long : on garde la date et le titre
  if(n.length>48)n=n.slice(0,47).replace(/\s+\S*$/,'')+'…';       // encore trop long : on tronque proprement
  return n;
}
function evOf(s){
  var d=addDays(PLAN_START,sessIdx(s)),type={swim:'Swim',bike:'Ride',run:'Run',brick:'Run',str:'WeightTraining'}[s.sp];
  return {category:'WORKOUT',start_date_local:isoDate(d)+'T00:00:00',type:type,name:evName(s),description:s.wk?wkText(s.wk):s.lines.map(function(l){return tx(l);}).join('\n'),external_id:'im27:'+s.id};
}

/* Semaine d’essai : la semaine 1 du plan est envoyée sur les 6 prochains jours, marquée [ESSAI], pour voir à quoi ressemblent les séances sur la montre */
function previewList(){return ALLS.filter(function(s){return s.w===1&&s.sp!=='race';});}
function previewOps(){
  var sv=state.sv,t1=addDays(today(),1),o=isoDate(t1),n=isoDate(addDays(t1,32));
  return svFetch('/api/events?oldest='+o+'&newest='+n).then(function(r){if(!r.ok)throw new Error('Erreur '+r.status);return r.json();}).then(function(ex){
    return (Array.isArray(ex)?ex:[]).filter(function(e){return e.external_id&&String(e.external_id).indexOf('im27prev:')===0;});
  });
}
function runOps(ops){
  var chain=Promise.resolve();
  ops.forEach(function(op){chain=chain.then(function(){return svFetch(op[0],{method:op[1],headers:{'Content-Type':'application/json'},body:op[2]?JSON.stringify(op[2]):undefined}).then(function(r){if(!r.ok)throw new Error('Erreur '+r.status);});});});
  return chain;
}
function errTxt(e){var m=(e&&e.message)||'Échec';return m==='Failed to fetch'||m==='Load failed'?'Serveur injoignable':m;}
function pushPreview(){
  if(!state.sv.url||!state.sv.key){toast('Configure d’abord la synchronisation (Réglages)');return Promise.resolve();}
  if(pushing)return Promise.resolve();
  pushing=true;toast('Envoi de la semaine d’essai…');
  var t1=addDays(today(),1);
  return previewOps().then(function(old){
    var ops=old.map(function(e){return ['/api/events/'+e.id,'DELETE',null];});
    previewList().forEach(function(s){
      var ev=evOf(s);
      ev.start_date_local=isoDate(addDays(t1,Math.max(0,s.d-1)))+'T00:00:00';
      ev.name='[ESSAI] '+s.title;ev.external_id='im27prev:'+s.id;
      ops.push(['/api/events','POST',ev]);
    });
    return runOps(ops).then(function(){return ops.filter(function(o){return o[1]==='POST';}).length;});
  }).then(function(n){pushing=false;toast(n+' séances d’essai envoyées du '+fmtDay(t1)+' au '+fmtDay(addDays(t1,5)));})
    .catch(function(e){pushing=false;toast(errTxt(e));});
}
function clearPreview(){
  if(!state.sv.url||!state.sv.key||pushing)return Promise.resolve();
  pushing=true;
  return previewOps().then(function(old){return runOps(old.map(function(e){return ['/api/events/'+e.id,'DELETE',null];})).then(function(){return old.length;});})
    .then(function(n){pushing=false;toast(n?n+' séance'+(n>1?'s':'')+' d’essai retirée'+(n>1?'s':''):'Aucune séance d’essai à retirer');})
    .catch(function(e){pushing=false;toast(errTxt(e));});
}

function nextSession(wk){
  var t=today(),i,j;
  for(i=0;i<7;i++){
    var day=wk.days[i];if(diffDays(day.date,t)<0)continue;
    for(j=0;j<day.sessions.length;j++){var s=day.sessions[j];if(s.sp!=='rest'&&!isDone(s))return {s:s,day:diffDays(day.date,t)===0?'Aujourd’hui':day.name};}

  for(i=0;i<7;i++)for(j=0;j<wk.days[i].sessions.length;j++){var q=wk.days[i].sessions[j];if(q.sp!=='rest'&&!isDone(q)&&diffDays(wk.days[i].date,t)<0)return {s:q,day:wk.days[i].name+' (à rattraper)'};}

function chart(st){

  for(v=0;v<=top;v+=4){

  var curW=st.s==='before'?1:st.s==='after'?NW:st.w;
  var vis=[];
  PHASES.forEach(function(p,i){var a=0,b=0,w;for(w=1;w<=NW;w++)if(phaseOf(w)===p){if(!a)a=w;b=w;}if(a)vis.push({p:p,i:i,a:a,b:b});});

  stepList().forEach(function(x){if(stepInPlan(x))h+='<i class="mkst" style="left:'+(idxOfDate(parseYmd(x.date))+0.5)/(NW*7)*100+'%" title="'+esc(x.name)+'"></i>';});
  if(st.s!=='before')h+='<i class="mk" style="left:'+(Math.min(100,cur/NW*100))+'%"></i>';

  vis.forEach(function(v){h+='<span style="flex:'+(v.b-v.a+1)+'">S'+v.a+'</span>';});

  h+='<p class="plan-note">Cycles de 3 semaines de charge + 1 de décharge, puis un affûtage de '+T_TAPER+' semaine'+(T_TAPER>1?'s':'')+' avant la semaine de course.</p></section>';
  var maxMin=0;PLAN.forEach(function(w){maxMin=Math.max(maxMin,w.min);});
  h+='<h2 class="plan-h">Semaine par semaine<span>'+BLOCKS.length+' bloc'+(BLOCKS.length>1?'s':'')+'</span></h2>';
  BLOCKS.forEach(function(b){
    var bm=0,bd=0,bn=0,i;
    for(i=b.a;i<=b.b;i++){bm+=PLAN[i-1].min;var q=wkStats(PLAN[i-1]);bd+=q.d;bn+=q.n;}
    var all=bn>0&&bd===bn,id='b'+b.a;
    var isNow=live&&curW>=b.a&&curW<=b.b,past=st.s==='after'||curW>b.b;
    h+='<details class="pblk'+(isNow?' cur':'')+(past?' past':'')+'" data-pl="'+id+'"'+(planFold(id,curW>=b.a&&curW<=b.b)?' open':'')+'><summary><span class="bt"><b>'+b.n+(isNow?'<span class="now">En cours</span>':'')+'</b><small>S'+b.a+(b.b>b.a?' – S'+b.b:'')+' · '+fmtDay(PLAN[b.a-1].start)+' → '+fmtDay(addDays(PLAN[b.b-1].start,6))+(yr?' '+addDays(PLAN[b.b-1].start,6).getFullYear():'')+'</small></span>'+
      '<span class="bh">'+fh(bm)+'<small'+(all?' class="ok"':'')+'>'+(all?'Terminé':bd+' / '+bn+' séance'+(bn>1?'s':''))+'</small></span>'+(bd?'<span class="pg"><i style="width:'+pct(bd,bn)+'%"></i></span>':'')+'</summary><p class="bg">'+esc(b.g)+'</p><div class="wks">';
    for(i=b.a;i<=b.b;i++){
      var wk=PLAN[i-1],ws=wkStats(wk),isCur=i===st.w&&(st.s==='during'||st.s==='raceday'),ok=ws.n>0&&ws.d===ws.n;
      h+='<button class="wk'+(isCur?' cur':'')+'" data-act="gowk" data-w="'+i+'"><span class="wn">'+i+'</span><span class="wm"><b>'+fmtRange(wk.start)+'</b><small>'+KIND[wk.kind]+(isCur?' · en cours':'')+'</small>'+stepsOfWeek(i).map(function(x){return '<small class="wkst">'+ic('race',12)+esc(x.name)+'</small>';}).join('')+'</span>'+
        '<span class="wh">'+(wk.kind==='race'?'Jour J':fh(wk.min))+bar(pct(wk.min,maxMin))+'</span>'+
        (ok?'<span class="wd ok">'+ic('check',14)+'</span>':'<span class="wd">'+(ws.n?ws.d+'/'+ws.n:'')+'</span>')+'</button>';

(function(){

  document.addEventListener('touchstart',function(e){
    var t=e.touches&&e.touches[0],w=window.innerWidth||390;
    ok=!!t&&e.touches.length===1&&tab==='week'&&!document.getElementById('sheetbg').classList.contains('on')&&t.clientX>24&&t.clientX<w-24&&!(e.target.closest&&e.target.closest('input,textarea,select,svg[data-ch]'));

/* ---------- Niveau déclaré (sans historique Garmin) ----------
   Petit questionnaire : un temps récent par discipline, à effort soutenu (course : 5 km, 10 km ou semi ; vélo : une sortie ; natation :
   200 m à 1 500 m). Il sert de repli quand Garmin n'a pas assez de sorties : allures des séances (seuil course, CSS natation, vitesse
   vélo) et estimation du temps de course. Les vraies sorties Garmin passent toujours avant, discipline par discipline.
   Stockage : state.ui.lvl = {run:{d:mètres,t:secondes}, bike:{d:mètres,t:secondes}, swim:{d:mètres,t:secondes}}. */
var LV_RUN=[[5000,'5 km'],[10000,'10 km'],[21097,'Semi']],LV_SWIM=[[200,'200 m'],[400,'400 m'],[1000,'1 000 m'],[1500,'1 500 m']];
function lvGet(k){
  var l=(state.ui.lvl||{})[k];if(!l||!(l.d>0)||!(l.t>0))return null;
  var q=k==='run'?l.t/(l.d/1000):k==='swim'?l.t/l.d*100:l.d/l.t*3.6;
  return (k==='bike'?(q>=8&&q<=50):k==='run'?(q>=150&&q<=600):(q>=50&&q<=300))?l:null;
}
// Le questionnaire n'est proposé que sans Garmin connecté avec des activités
function lvOffered(){var sv=state.sv||{};return !(sv.url&&sv.key&&dataActs().length);}
function lvAny(){return !!(lvGet('run')||lvGet('bike')||lvGet('swim'));}
function lvT(t){t=Math.round(t);return t>=3600?Math.floor(t/3600)+':'+('0'+Math.floor(t%3600/60)).slice(-2)+':'+('0'+t%60).slice(-2):mmss(t);}

// Temps de course d'une discipline d'après le questionnaire (mêmes pénalités et scénarios que l'estimation Garmin)
function declRace(k,P,sc){
  var l=lvGet(k);if(!l)return null;
  var b0='d’après ton questionnaire ('+lvTxt(k,l)+')';
  if(k==='swim')return {t:riegel(l,RACE.swimM)*1.05*(P.wet?0.97:1)*sc.sw,n:0,conf:'faible',basis:b0+', projeté sur '+fk(RACE.swimM)+' km, +5 % (eau libre, repérage)'+(P.wet?', −3 % combinaison':'')};
  if(k==='run'){
    var vr=Math.max(1000/510,Math.min(1000/270,RACE.runM/riegel(l,RACE.runM)));
    return {t:RACE.runM/vr*sc.rn,n:0,conf:'faible',basis:b0+', projeté sur '+RUNLBL+' ; allure ralentie de '+Math.round((sc.rn-1)*100)+' % (fatigue du vélo, ravitaillements)'};
  }
  var v=l.d/l.t*3.6*Math.max(0.82,Math.min(1.08,Math.pow(l.d/RACE.bikeM,0.06)));
  v=Math.max(14,Math.min(40,v))*sc.bk;
  return {t:RACE.bikeM/(v/3.6)*(1+0.03*FF)+240*FF,n:0,conf:'faible',basis:b0+', projeté sur '+fk(RACE.bikeM)+' km'+(FF>=0.5?' ; +'+Math.round(3*FF*10)/10+' % d’endurance, '+Math.round(4*FF)+' min d’arrêts':'')};
}
// Repères d'allure déduits du questionnaire : seuil course (≈ 10 km) et CSS natation (≈ 1 500 m), au format des repères saisis à la main

/* ---------- Sélecteur de durée à molettes (comme les alarmes de l'iPhone) ----------

function tpSplit(u,t){var o={},r=Math.round(t);if(u.h){o.h=Math.floor(r/3600);r-=o.h*3600;}if(u.m){o.m=Math.floor(r/60);r-=o.m*60;}if(u.s)o.s=r;return o;}

function tpIdx(wl){return Math.max(0,Math.min(wl.children.length-1,Math.round(wl.scrollTop/40)));}

/* ---------- Estimation du temps de course (IRONMAN full distance) ----------
   Natation : allure médiane de tes nages ≥ 1 km. Vélo et course : régression vitesse = f(FC moyenne, dénivelé/km)
   sur tes sorties des 26 dernières semaines, prédite à la FC cible d’Ironman et au relief du parcours, puis
   pénalités de fatigue (endurance sur 178 km, marathon après le vélo) selon le scénario. Pas de puissance : tout repose sur la FC. */
var FF=FMT.fat||1;      // les pénalités de fatigue (endurance vélo, course après le vélo) sont celles de l'Ironman, réduites pour les formats courts
var RSCEN={prud:{n:'Prudent',sw:1.06,bk:0.94,rn:1+0.22*FF},real:{n:'Réaliste',sw:1,bk:1,rn:1+0.12*FF},ambi:{n:'Ambitieux',sw:0.96,bk:1.05,rn:1+0.06*FF}};
function raceParams(){
  var p=state.ui.race||{},m=state.sv&&state.sv.meta||{},lt=m.lthr||(m.maxhr?Math.round(m.maxhr*0.9):172);
  return {bikeUp:p.bikeUp!==undefined?p.bikeUp:(CFG.bikeUp==null?null:CFG.bikeUp),runUp:p.runUp!==undefined?p.runUp:(CFG.runUp==null?null:CFG.runUp),hrB:p.hrB||Math.round(lt*FMT.hr[0]),hrR:p.hrR||Math.round(lt*FMT.hr[1]),

function medianOf(a){var s=a.slice().sort(function(x,y){return x-y;}),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0;}

    if(Math.abs(M[p][i])<1e-9)return null;
    var t=M[i];M[i]=M[p];M[p]=t;
    for(j=i+1;j<3;j++){var f=M[j][i]/M[i][i];for(k=i;k<4;k++)M[j][k]-=f*M[i][k];}

// Poids d’une activité : divisé par 2 toutes les 8 semaines (les allures cibles suivent ta forme récente)
function wtOf(a,base){return Math.pow(0.5,Math.max(0,base-dayIdx(a))/56);}

function fitLin(rows){

function estRace(all,P,cut){

  // natation

    else{v=wMedian(rb.map(function(r){return r[0];}),rb.map(function(r){return r[3];}));basis='vitesse médiane de tes '+rb.length+' sorties ('+v.toFixed(1).replace('.',',')+' km/h), données insuffisantes pour une régression';}

  var rr=win.filter(function(a){return a.t!=='VirtualRun'&&/Run/.test(a.t)&&a.m>=4000&&a.d>=1500&&a.h>0;}).map(function(a){return [a.m/a.d,a.h,a.z/a.m*1000,wtOf(a,base)];});
  if(rr.length>=3){

function adHero(a,k){

// « Charge » d'intervals.icu, traduite : niveau, repère et comparaison à tes propres séances de la même discipline
function effortCard(a,k){

    if(same.length>=5&&SPLBL[k]&&k!=='oth'){var below=same.filter(function(x){return x.l<a.l;}).length;cmp='Plus exigeante que <b>'+pct(below,same.length)+' %</b> de tes séances de '+SPLBL[k].toLowerCase()+'.';}
  }

function actDetailBody(a){

function showSheet(title,sub,body,k){

function openPickAct(sid){

    var os=LK.a2s[a.id]&&SBY[LK.a2s[a.id]];

function openPickSess(aid){
  var a=null;((state.sv.acts)||[]).forEach(function(x){if(String(x.id)===String(aid))a=x;});if(!a)return;

function openAllActs(){
  var acts=((state.sv.acts)||[]).slice().sort(function(x,y){return y.s>x.s?1:-1;}),tot={swim:[0,0,0],bike:[0,0,0],run:[0,0,0],str:[0,0,0]};

function isoDate(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

function typing(){var ae=document.activeElement;return !!(ae&&/^(TEXTAREA|INPUT)$/.test(ae.tagName));}

function syncActs(force,loud){
  var sv=state.sv;if(!sv.url||!sv.key||syncing)return;
  if(!force&&Date.now()-(sv.t||0)<60000)return;
  syncing=true;
  svFetch('/api/activities?since='+isoDate(addDays(today(),-400)))
    .then(function(r){if(!r.ok)throw new Error(r.status===401?'Clé invalide':'Erreur serveur ('+r.status+')');return r.json();})
    .then(function(j){
      var acts=j.activities||[],changed=JSON.stringify(acts)!==JSON.stringify(sv.acts||[])||sv.conn!==!!j.connected||!!sv.err||(sv.werr||'')!==(j.error||'');

      if(loud)toast('Activités synchronisées');
      if(changed||loud)safeRender();
    })
    .catch(function(e){
      var m=(e&&e.message)||'Hors ligne';sv.err=(m==='Failed to fetch'||m==='Load failed')?'Serveur injoignable':m;save();
      if(loud)toast(sv.err);safeRender();

}

    '<label class="inp wide"><span>Clé d’accès</span><input id="sv-key" type="text" name="ironman-app-key" autocomplete="off" data-lpignore="true" style="-webkit-text-security:disc;text-security:disc" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(sv.key||'')+'"></label>'+
